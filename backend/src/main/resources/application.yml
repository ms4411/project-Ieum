spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  application:
    name: backend
  datasource:
    # 환경 변수가 없으면 콜론(:) 뒤의 기본값(localhost)을 사용합니다.
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:5432/mydb}
    username: ${DATASOURCE_USERNAME:mysql}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: ${DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

jwt:
  secret-key: ${JWT_KEY}
file:
  upload-dir: ./upload_imgs/
